[tox]
envlist = py{38,39,310,311,312,313,314},lint
passenv = LD_PRELOAD

[testenv]
deps =
    pytest
    pytest-cov
    parameterized
commands =
    pytest --cov=configcatclient configcatclienttests

[testenv:lint]
deps =
    flake8
commands =
    # Statical analysis
    flake8 configcatclient --count --show-source --statistics
