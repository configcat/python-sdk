name: Python CI

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: [master]

  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version:
          [
            "3.8",
            "3.9",
            "3.10",
            "3.11",
            "3.12",
            "3.13",
            "3.14",
          ]
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-rerunfailures pytest-cov parameterized mock flake8
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          # Statical analysis
          flake8 configcatclient --count --show-source --statistics

      - name: Test
        run: pytest configcatclienttests --reruns 3

  coverage:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip 
          pip install pytest pytest-cov parameterized mock flake8
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          # Statical analysis
          flake8 configcatclient --count --show-source --statistics

      - name: Run coverage
        run: pytest --cov=configcatclient configcatclienttests

      - name: Upload coverage report
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
